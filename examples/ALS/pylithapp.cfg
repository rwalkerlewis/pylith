# Common PyLith parameters for the ALS paleoseismic example.
#
# The domain covers ~19 km x 21 km in EPSG:28351 coordinates with
# a NE-SW-trending fault splitting the domain into a western and
# eastern material block.
#
# This file is NOT self-contained; individual step*.cfg files add
# boundary conditions, fault kinematics, and output settings.

[pylithapp.metadata]
keywords = [example, 2D, ALS, paleoseismic, strike-slip]
features = [
    Triangular cells,
    pylith.meshio.MeshIOPetsc,
    pylith.problems.TimeDependent,
    pylith.materials.Elasticity,
    pylith.materials.IsotropicLinearElasticity,
    pylith.faults.FaultCohesiveKin,
    pylith.faults.KinSrcStep,
    pylith.bc.DirichletTimeDependent,
    spatialdata.spatialdb.UniformDB,
    pylith.meshio.DataWriterHDF5
    ]

# ----------------------------------------------------------------------
# journal
# ----------------------------------------------------------------------
[pylithapp.journal.info]
pylithapp = 1
timedependent = 1
solution = 1
meshiopetsc = 1
isotropiclinearelasticity = 1
dirichlettimedependent = 1
faultcohesivekin = 1
petscoptions = 1

# ----------------------------------------------------------------------
# mesh_generator
# ----------------------------------------------------------------------
[pylithapp.mesh_generator]
reader = pylith.meshio.MeshIOPetsc

# The mesh file is generated by generate_gmsh.py
reader.filename = mesh_tri.msh
reader.coordsys.space_dim = 2

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
# For a quasistatic simulation with a fault we need displacement plus
# Lagrange-multiplier fields.
solution = pylith.problems.SolnDispLagrange

# Length scale for nondimensionalisation (domain is ~20 km across).
scales.length_scale = 20.0*km

# Use quadrature order 1 for efficiency.
defaults.quadrature_order = 1

# Output the solution over the full domain.
solution_observers = [domain]

# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
[pylithapp.problem]
# Two materials: one on each side of the fault.
materials = [slab_west, slab_east]

# -- West block (material tag 1) -----------------------------------------
[pylithapp.problem.materials.slab_west]
label_value = 1

# Uniform elastic properties (Christensen & Mooney 1995 averages).
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Elastic properties for west block
db_auxiliary_field.values = [density, vs, vp]
db_auxiliary_field.data = [2700.0*kg/m**3, 3.464*km/s, 6.0*km/s]

auxiliary_subfields.density.basis_order = 0
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0

derived_subfields.cauchy_strain.basis_order = 0
derived_subfields.cauchy_stress.basis_order = 0

# -- East block (material tag 2) -----------------------------------------
[pylithapp.problem.materials.slab_east]
label_value = 2

db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Elastic properties for east block
db_auxiliary_field.values = [density, vs, vp]
db_auxiliary_field.data = [2700.0*kg/m**3, 3.464*km/s, 6.0*km/s]

auxiliary_subfields.density.basis_order = 0
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0

derived_subfields.cauchy_strain.basis_order = 0
derived_subfields.cauchy_stress.basis_order = 0

# ----------------------------------------------------------------------
# fault
# ----------------------------------------------------------------------
[pylithapp.problem]
interfaces = [fault]

[pylithapp.problem.interfaces.fault]
# The label and label_value must match the physical group in the mesh.
label = fault
label_value = 20

observers.observer.data_fields = [slip, traction_change]

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem]
# Dirichlet BCs on the east and west boundaries (constrain both dof).
bc = [bc_xneg, bc_xpos]
bc.bc_xneg = pylith.bc.DirichletTimeDependent
bc.bc_xpos = pylith.bc.DirichletTimeDependent

[pylithapp.problem.bc.bc_xneg]
label = boundary_xneg
label_value = 10
constrained_dof = [0, 1]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on -x (west) boundary

[pylithapp.problem.bc.bc_xpos]
label = boundary_xpos
label_value = 11
constrained_dof = [0, 1]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on +x (east) boundary


# End of file
