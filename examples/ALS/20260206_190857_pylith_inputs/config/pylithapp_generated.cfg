# Auto-generated PyLith template based on the ALS geospatial data.
#
# This file was originally generated by the ALS workflow tool and has
# been corrected to work with PyLith v3/v4.
#
# The mesh file must first be generated by running:
#   python generate_gmsh.py --write
# in the parent ALS directory.
#
# Material properties are from Christensen & Mooney (1995, EPSL 132,
# 341-353), average continental crust velocities and densities.
# Fault slip parameters are placeholder values.

[pylithapp]
problem = pylith.problems.TimeDependent

# ----------------------------------------------------------------------
# mesh
# ----------------------------------------------------------------------
[pylithapp.mesh_generator]
reader = pylith.meshio.MeshIOPetsc
reader.filename = ../../mesh_tri.msh
reader.coordsys.space_dim = 2

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
# For a quasistatic simulation with a fault, we need displacement plus
# Lagrange-multiplier fields.
solution = pylith.problems.SolnDispLagrange

# Length scale for nondimensionalisation (~20 km domain).
scales.length_scale = 20.0*km

# Two material regions: west of fault (tag 1) and east of fault (tag 2).
materials = [slab_west, slab_east]

# One fault interface (simplified from ALS fault layer).
interfaces = [fault]

# Four Dirichlet boundary conditions (zero displacement on all edges).
bc = [boundary_xneg, boundary_xpos, boundary_yneg, boundary_ypos]
bc.boundary_xneg = pylith.bc.DirichletTimeDependent
bc.boundary_xpos = pylith.bc.DirichletTimeDependent
bc.boundary_yneg = pylith.bc.DirichletTimeDependent
bc.boundary_ypos = pylith.bc.DirichletTimeDependent

# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
# West block (tag 1)
[pylithapp.problem.materials.slab_west]
label_value = 1
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Elastic properties for west block
db_auxiliary_field.values = [density, vs, vp]
db_auxiliary_field.data = [2700.0*kg/m**3, 3.464*km/s, 6.0*km/s]
auxiliary_subfields.density.basis_order = 0
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0

# East block (tag 2)
[pylithapp.problem.materials.slab_east]
label_value = 2
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Elastic properties for east block
db_auxiliary_field.values = [density, vs, vp]
db_auxiliary_field.data = [2700.0*kg/m**3, 3.464*km/s, 6.0*km/s]
auxiliary_subfields.density.basis_order = 0
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0

# ----------------------------------------------------------------------
# fault
# ----------------------------------------------------------------------
[pylithapp.problem.interfaces.fault]
label = fault
label_value = 20

[pylithapp.problem.interfaces.fault.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Coseismic slip on fault
db_auxiliary_field.values = [initiation_time, final_slip_left_lateral, final_slip_opening]
db_auxiliary_field.data = [0.0*s, -1.0*m, 0.0*m]

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem.bc.boundary_xneg]
label = boundary_xneg
label_value = 10
constrained_dof = [0, 1]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on -x (west) boundary

[pylithapp.problem.bc.boundary_xpos]
label = boundary_xpos
label_value = 11
constrained_dof = [0, 1]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on +x (east) boundary

[pylithapp.problem.bc.boundary_yneg]
label = boundary_yneg
label_value = 12
constrained_dof = [0, 1]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on -y (south) boundary

[pylithapp.problem.bc.boundary_ypos]
label = boundary_ypos
label_value = 13
constrained_dof = [0, 1]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on +y (north) boundary


# End of file
