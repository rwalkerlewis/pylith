# Step 02: Coseismic fault slip
#
# Static problem with coseismic left-lateral slip on the fault.
# Boundary conditions hold all four domain edges fixed while a
# uniform 1 m of left-lateral slip is applied on the fault.
#
# Material properties are from the ALS geospatial database
# (Christensen & Mooney 1995 averages for continental crust).
# Fault slip parameters come from the 20260206_190857_pylith_inputs
# data package.

[pylithapp.metadata]
#  y
#  ^
#  |
#   --> x
#
#         --------------------
#         |        /         |
# Ux,Uy=0 |  <--- / ---->   | Ux,Uy=0
#         |      / fault     |
#         |     /   1m L-lat |
#         --------------------
#            Ux,Uy=0
#
base = [pylithapp.cfg]
description = Coseismic left-lateral fault slip with fixed boundaries.
authors = [ALS Example]
keywords = [coseismic, fault slip, left-lateral]
arguments = [step02_coseismic.cfg]
version = 1.0.0
pylith_version = [>=3.0, <6.0]

features = [
    Static simulation,
    pylith.faults.FaultCohesiveKin,
    pylith.faults.KinSrcStep,
    spatialdata.spatialdb.UniformDB
    ]


# ----------------------------------------------------------------------
# output
# ----------------------------------------------------------------------
[pylithapp.problem]
defaults.name = step02_coseismic

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
# Use all four boundaries, all fixed.
[pylithapp.problem]
bc = [bc_xneg, bc_xpos, bc_yneg, bc_ypos]
bc.bc_xneg = pylith.bc.DirichletTimeDependent
bc.bc_xpos = pylith.bc.DirichletTimeDependent
bc.bc_yneg = pylith.bc.DirichletTimeDependent
bc.bc_ypos = pylith.bc.DirichletTimeDependent

[pylithapp.problem.bc.bc_xneg]
label = boundary_xneg
label_value = 10
constrained_dof = [0, 1]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on -x boundary

[pylithapp.problem.bc.bc_xpos]
label = boundary_xpos
label_value = 11
constrained_dof = [0, 1]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on +x boundary

[pylithapp.problem.bc.bc_yneg]
label = boundary_yneg
label_value = 12
constrained_dof = [0, 1]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on -y boundary

[pylithapp.problem.bc.bc_ypos]
label = boundary_ypos
label_value = 13
constrained_dof = [0, 1]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on +y boundary

# ----------------------------------------------------------------------
# fault
# ----------------------------------------------------------------------
# Uniform 1 m left-lateral slip (values from ALS pylith_inputs
# manifest: left_lateral_slip_m = 1.0, reverse_slip_m = 0.0,
# rise_time_s = 10.0).
[pylithapp.problem.interfaces.fault.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Fault rupture for coseismic slip
db_auxiliary_field.values = [initiation_time, final_slip_left_lateral, final_slip_opening]
db_auxiliary_field.data = [0.0*s, -1.0*m, 0.0*m]


# End of file
