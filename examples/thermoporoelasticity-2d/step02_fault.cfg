[pylithapp.metadata]
#  y (up)
#  ^
#  |
#   --> x
#
#         surface (y=0, T=300 K, p=0)
#     --------------------
#     |         |        |
#     |         |fault   |
#     |  slip<--|        |
#     |         *        |  <- fault tip at 7.5 km depth
#     |                  |
#     --------------------
#         bottom (y=-10 km, T=450 K)
#
# This simulation models kinematic fault slip with coupled THM:
# - Prescribed left-lateral slip on fault
# - Coupled pressure and temperature response
# - Demonstrates fault-THM interaction
#
# Boundary conditions:
# - Fixed displacement on boundaries
# - Zero pressure on top (drained)
# - Fixed temperature at surface and bottom
#
base = [pylithapp.cfg]
description = Thermoporoelasticity with kinematic fault.
authors = [PyLith Development Team]
keywords = [thermoporoelasticity, THM coupling, kinematic fault, slip]
arguments = [step02_fault.cfg]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

features = [
    Quasistatic simulation,
    Thermoporoelasticity,
    Kinematic fault,
    pylith.faults.FaultCohesiveKin,
    pylith.problems.SolnDispPresTracStrainTempLagrange
    ]

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
defaults.name = step02_fault

# For thermoporoelasticity with a fault, we need Lagrange multipliers
solution = pylith.problems.SolnDispPresTracStrainTempLagrange

# Simulation time
initial_dt = 10.0*year
start_time = -10.0*year
end_time = 500.0*year

# ----------------------------------------------------------------------
# solution
# ----------------------------------------------------------------------
[pylithapp.problem.solution.subfields.displacement]
basis_order = 2

[pylithapp.problem.solution.subfields.pressure]
basis_order = 1

[pylithapp.problem.solution.subfields.trace_strain]
basis_order = 1

[pylithapp.problem.solution.subfields.temperature]
basis_order = 1

[pylithapp.problem.solution.subfields.lagrange_multiplier_fault]
basis_order = 1

# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
# We need two material blocks for the fault to separate them
[pylithapp.problem]
materials = [crust_xneg, crust_xpos]
materials.crust_xneg = pylith.materials.Thermoporoelasticity
materials.crust_xpos = pylith.materials.Thermoporoelasticity

# Material properties for negative-x side of fault
[pylithapp.problem.materials.crust_xneg]
description = Thermoporoelastic crust (x < 0)
label_value = 1

db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Thermoporoelastic material properties
db_auxiliary_field.values = [solid_density, fluid_density, fluid_viscosity, porosity, shear_modulus, drained_bulk_modulus, biot_coefficient, biot_modulus, isotropic_permeability, specific_heat, thermal_conductivity, reference_temperature, thermal_expansion_coefficient, fluid_thermal_expansion]
db_auxiliary_field.data = [2700.0*kg/m**3, 1000.0*kg/m**3, 0.001*Pa*s, 0.1, 6.0*GPa, 10.0*GPa, 0.8, 10.0*GPa, 1.0e-15*m**2, 900.0*J/(kg*K), 3.0*W/(m*K), 300.0*K, 2.4e-5*1/K, 2.1e-4*1/K]

auxiliary_subfields.solid_density.basis_order = 0
auxiliary_subfields.fluid_density.basis_order = 0
auxiliary_subfields.fluid_viscosity.basis_order = 0
auxiliary_subfields.porosity.basis_order = 0

bulk_rheology = pylith.materials.IsotropicLinearThermoporoelasticity
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.drained_bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.biot_coefficient.basis_order = 0
bulk_rheology.auxiliary_subfields.biot_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.isotropic_permeability.basis_order = 0
bulk_rheology.auxiliary_subfields.specific_heat.basis_order = 0
bulk_rheology.auxiliary_subfields.thermal_conductivity.basis_order = 0
bulk_rheology.auxiliary_subfields.reference_temperature.basis_order = 0
bulk_rheology.auxiliary_subfields.thermal_expansion_coefficient.basis_order = 0
bulk_rheology.auxiliary_subfields.fluid_thermal_expansion.basis_order = 0

derived_subfields.cauchy_strain.basis_order = 0
derived_subfields.cauchy_stress.basis_order = 0

# Material properties for positive-x side of fault
[pylithapp.problem.materials.crust_xpos]
description = Thermoporoelastic crust (x > 0)
label_value = 2

db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Thermoporoelastic material properties
db_auxiliary_field.values = [solid_density, fluid_density, fluid_viscosity, porosity, shear_modulus, drained_bulk_modulus, biot_coefficient, biot_modulus, isotropic_permeability, specific_heat, thermal_conductivity, reference_temperature, thermal_expansion_coefficient, fluid_thermal_expansion]
db_auxiliary_field.data = [2700.0*kg/m**3, 1000.0*kg/m**3, 0.001*Pa*s, 0.1, 6.0*GPa, 10.0*GPa, 0.8, 10.0*GPa, 1.0e-15*m**2, 900.0*J/(kg*K), 3.0*W/(m*K), 300.0*K, 2.4e-5*1/K, 2.1e-4*1/K]

auxiliary_subfields.solid_density.basis_order = 0
auxiliary_subfields.fluid_density.basis_order = 0
auxiliary_subfields.fluid_viscosity.basis_order = 0
auxiliary_subfields.porosity.basis_order = 0

bulk_rheology = pylith.materials.IsotropicLinearThermoporoelasticity
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.drained_bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.biot_coefficient.basis_order = 0
bulk_rheology.auxiliary_subfields.biot_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.isotropic_permeability.basis_order = 0
bulk_rheology.auxiliary_subfields.specific_heat.basis_order = 0
bulk_rheology.auxiliary_subfields.thermal_conductivity.basis_order = 0
bulk_rheology.auxiliary_subfields.reference_temperature.basis_order = 0
bulk_rheology.auxiliary_subfields.thermal_expansion_coefficient.basis_order = 0
bulk_rheology.auxiliary_subfields.fluid_thermal_expansion.basis_order = 0

derived_subfields.cauchy_strain.basis_order = 0
derived_subfields.cauchy_stress.basis_order = 0

# ----------------------------------------------------------------------
# fault
# ----------------------------------------------------------------------
[pylithapp.problem]
interfaces = [fault]

[pylithapp.problem.interfaces.fault]
label = fault
label_value = 20

edge = fault_edge
edge_value = 21

eq_ruptures = [rupture]

observers.observer.data_fields = [slip, traction_change]

[pylithapp.problem.interfaces.fault.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = Fault rupture auxiliary field
db_auxiliary_field.filename = fault_slip.spatialdb
db_auxiliary_field.query_type = linear

origin_time = 0.0*year

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
# Override to fix all displacement components on boundaries
[pylithapp.problem.bc.bc_left_disp]
constrained_dof = [0, 1]

[pylithapp.problem.bc.bc_right_disp]
constrained_dof = [0, 1]

[pylithapp.problem.bc.bc_bottom_disp]
constrained_dof = [0, 1]

# ----------------------------------------------------------------------
# PETSc
# ----------------------------------------------------------------------
[pylithapp.petsc]
fieldsplit_lagrange_multiplier_fault_pc_type = lu

# ----------------------------------------------------------------------
# output
# ----------------------------------------------------------------------
[pylithapp.problem.solution_observers.domain]
data_fields = [displacement, pressure, temperature]
trigger.num_skip = 4

[pylithapp.problem.materials.crust_xneg.observers.observer]
data_fields = [cauchy_stress, cauchy_strain]

[pylithapp.problem.materials.crust_xpos.observers.observer]
data_fields = [cauchy_stress, cauchy_strain]

# End of file
