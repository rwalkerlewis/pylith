[pylithapp.metadata]
# This is not a self-contained simulation configuration file. This
# file only specifies the general parameters common to the simulations
# in this directory.
keywords = [example, 2D, thermoporoelasticity, THM coupling, thermal-hydraulic-mechanical]
features = [
    Triangular cells,
    pylith.meshio.MeshIOPetsc,
    pylith.problems.TimeDependent,
    pylith.materials.Thermoporoelasticity,
    pylith.materials.IsotropicLinearThermoporoelasticity,
    pylith.bc.DirichletTimeDependent,
    spatialdata.spatialdb.UniformDB,
    pylith.meshio.DataWriterHDF5
    ]

# ----------------------------------------------------------------------
# journal
# ----------------------------------------------------------------------
[pylithapp.journal.info]
pylithapp = 1
timedependent = 1
solution = 1
meshiopetsc = 1
thermoporoelasticity = 1
isotropiclinearthermoporoelasticity = 1
dirichlettimedependent = 1
petscoptions = 1

# ----------------------------------------------------------------------
# mesh_generator
# ----------------------------------------------------------------------
[pylithapp.mesh_generator]
reader = pylith.meshio.MeshIOPetsc
reader.filename = mesh_tri.msh
reader.coordsys.space_dim = 2

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
# Set defaults for output
defaults.name = thermoporoelasticity

[pylithapp.problem.defaults]
quadrature_order = 2

# Scales for nondimensionalization
[pylithapp.problem]
scales = pylith.scales.QuasistaticPoroelasticity
scales.length_scale = 10.0*km
scales.displacement_scale = 1.0*m
scales.shear_modulus = 6.0*GPa
scales.viscosity = 0.001*Pa*s
scales.permeability = 1e-15*m**2

# Output the solution over the domain
solution_observers = [domain]

# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
# We use thermoporoelastic material with uniform properties.
[pylithapp.problem]
materials = [crust]
materials.crust = pylith.materials.Thermoporoelasticity

[pylithapp.problem.materials.crust]
description = Thermoporoelastic crust
label_value = 1

# Material properties database
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Thermoporoelastic material properties
db_auxiliary_field.values = [solid_density, fluid_density, fluid_viscosity, porosity, shear_modulus, drained_bulk_modulus, biot_coefficient, biot_modulus, isotropic_permeability, specific_heat, thermal_conductivity, reference_temperature, thermal_expansion_coefficient, fluid_thermal_expansion]
db_auxiliary_field.data = [2700.0*kg/m**3, 1000.0*kg/m**3, 0.001*Pa*s, 0.1, 6.0*GPa, 10.0*GPa, 0.8, 10.0*GPa, 1.0e-15*m**2, 900.0*J/(kg*K), 3.0*W/(m*K), 300.0*K, 2.4e-5*1/K, 2.1e-4*1/K]

# Auxiliary subfield discretization
auxiliary_subfields.solid_density.basis_order = 0
auxiliary_subfields.fluid_density.basis_order = 0
auxiliary_subfields.fluid_viscosity.basis_order = 0
auxiliary_subfields.porosity.basis_order = 0

bulk_rheology = pylith.materials.IsotropicLinearThermoporoelasticity
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.drained_bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.biot_coefficient.basis_order = 0
bulk_rheology.auxiliary_subfields.biot_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.isotropic_permeability.basis_order = 0
bulk_rheology.auxiliary_subfields.specific_heat.basis_order = 0
bulk_rheology.auxiliary_subfields.thermal_conductivity.basis_order = 0
bulk_rheology.auxiliary_subfields.reference_temperature.basis_order = 0
bulk_rheology.auxiliary_subfields.thermal_expansion_coefficient.basis_order = 0
bulk_rheology.auxiliary_subfields.fluid_thermal_expansion.basis_order = 0

# Derived fields for output
derived_subfields.cauchy_strain.basis_order = 0
derived_subfields.cauchy_stress.basis_order = 0

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
# Displacement, pressure, and temperature boundary conditions
[pylithapp.problem]
bc = [bc_left_disp, bc_right_disp, bc_bottom_disp, bc_top_pres, bc_bottom_temp, bc_top_temp]
bc.bc_left_disp = pylith.bc.DirichletTimeDependent
bc.bc_right_disp = pylith.bc.DirichletTimeDependent
bc.bc_bottom_disp = pylith.bc.DirichletTimeDependent
bc.bc_top_pres = pylith.bc.DirichletTimeDependent
bc.bc_bottom_temp = pylith.bc.DirichletTimeDependent
bc.bc_top_temp = pylith.bc.DirichletTimeDependent

# Left boundary: fix horizontal displacement
[pylithapp.problem.bc.bc_left_disp]
label = boundary_left
label_value = 10
constrained_dof = [0]
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on left boundary

# Right boundary: fix horizontal displacement
[pylithapp.problem.bc.bc_right_disp]
label = boundary_right
label_value = 11
constrained_dof = [0]
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on right boundary

# Bottom boundary: fix vertical displacement
[pylithapp.problem.bc.bc_bottom_disp]
label = boundary_bottom
label_value = 12
constrained_dof = [1]
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on bottom boundary

# Top boundary: zero pressure (drained condition)
[pylithapp.problem.bc.bc_top_pres]
label = boundary_top
label_value = 13
constrained_dof = [0]
field = pressure
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Pressure BC on top boundary (drained)

# Bottom boundary: fixed temperature (geothermal)
[pylithapp.problem.bc.bc_bottom_temp]
label = boundary_bottom
label_value = 12
constrained_dof = [0]
field = temperature
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Temperature BC on bottom boundary
db_auxiliary_field.values = [initial_amplitude]
db_auxiliary_field.data = [450.0*K]

# Top boundary: fixed temperature (surface)
[pylithapp.problem.bc.bc_top_temp]
label = boundary_top
label_value = 13
constrained_dof = [0]
field = temperature
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Temperature BC on top boundary
db_auxiliary_field.values = [initial_amplitude]
db_auxiliary_field.data = [300.0*K]

# ----------------------------------------------------------------------
# initial conditions
# ----------------------------------------------------------------------
# Set initial temperature and pressure fields
[pylithapp.problem]
ic = [temperature_ic, pressure_ic]
ic.temperature_ic = pylith.problems.InitialConditionDomain
ic.pressure_ic = pylith.problems.InitialConditionDomain

[pylithapp.problem.ic.temperature_ic]
subfields = [temperature]
db = spatialdata.spatialdb.SimpleGridDB
db.description = Initial temperature (geothermal gradient)
db.filename = initial_temperature.spatialdb
db.query_type = linear

[pylithapp.problem.ic.pressure_ic]
subfields = [pressure]
db = spatialdata.spatialdb.SimpleGridDB
db.description = Initial pressure (hydrostatic)
db.filename = initial_pressure.spatialdb
db.query_type = linear

# ----------------------------------------------------------------------
# PETSc
# ----------------------------------------------------------------------
[pylithapp.petsc]
ts_type = beuler

# Use fieldsplit preconditioner for the coupled system
pc_type = fieldsplit
pc_fieldsplit_type = additive

fieldsplit_displacement_pc_type = lu
fieldsplit_pressure_pc_type = lu
fieldsplit_trace_strain_pc_type = lu
fieldsplit_temperature_pc_type = lu

ksp_rtol = 1.0e-10
ksp_atol = 1.0e-15
ksp_max_it = 200
ksp_gmres_restart = 50
ksp_error_if_not_converged = true

snes_rtol = 1.0e-10
snes_atol = 1.0e-10
snes_error_if_not_converged = true

# End of file
