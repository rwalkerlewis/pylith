[pylithapp.metadata]
#  y (up)
#  ^
#  |
#   --> x
#
#         surface (y=0, T=300 K, p=0)
#     --------------------
#     |                  |
#     |                  |
#     |    * injection   |  <- fluid injection at 5 km depth
#     |                  |
#     |                  |
#     --------------------
#         bottom (y=-10 km, T=450 K)
#
# This simulation models fluid injection-induced THM response:
# - Localized fluid source at depth
# - Pressure diffusion and induced deformation
# - Thermal effects from injection
# - No fault
#
# This example demonstrates how fluid injection can cause:
# - Pore pressure increase
# - Effective stress reduction
# - Ground surface deformation
#
base = [pylithapp.cfg]
description = Thermoporoelasticity with fluid injection (no fault).
authors = [PyLith Development Team]
keywords = [thermoporoelasticity, THM coupling, fluid injection, induced deformation]
arguments = [step03_injection.cfg]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

features = [
    Quasistatic simulation,
    Thermoporoelasticity,
    Fluid source,
    pylith.problems.SolnDispPresTracStrainTemp
    ]

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
defaults.name = step03_injection

# For thermoporoelasticity without a fault
solution = pylith.problems.SolnDispPresTracStrainTemp

# Simulation time for injection
initial_dt = 10.0*year
start_time = 0.0*year
end_time = 500.0*year

# ----------------------------------------------------------------------
# solution
# ----------------------------------------------------------------------
[pylithapp.problem.solution.subfields.displacement]
basis_order = 2

[pylithapp.problem.solution.subfields.pressure]
basis_order = 1

[pylithapp.problem.solution.subfields.trace_strain]
basis_order = 1

[pylithapp.problem.solution.subfields.temperature]
basis_order = 1

# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
# Enable source density (fluid source) for injection
[pylithapp.problem.materials.crust]
use_source_density = True

# We use a SimpleGridDB to specify a localized source at depth
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = Thermoporoelastic properties with injection source
db_auxiliary_field.filename = mat_injection.spatialdb
db_auxiliary_field.query_type = linear

# ----------------------------------------------------------------------
# initial conditions
# ----------------------------------------------------------------------
# Use equilibrium initial conditions (no perturbation)
[pylithapp.problem.ic.temperature_ic]
db = spatialdata.spatialdb.SimpleGridDB
db.description = Initial temperature (geothermal gradient)
db.filename = initial_temperature.spatialdb
db.query_type = linear

[pylithapp.problem.ic.pressure_ic]
db = spatialdata.spatialdb.SimpleGridDB
db.description = Initial pressure (hydrostatic)
db.filename = initial_pressure.spatialdb
db.query_type = linear

# ----------------------------------------------------------------------
# output
# ----------------------------------------------------------------------
[pylithapp.problem.solution_observers.domain]
data_fields = [displacement, pressure, temperature]
trigger.num_skip = 4

[pylithapp.problem.materials.crust.observers.observer]
data_fields = [cauchy_stress, cauchy_strain, porosity]

# End of file
