[pylithapp.metadata]
#  y (up)
#  ^
#  |
#   --> x
#
#         surface (y=0, T=300 K, p=0)
#     --------------------
#     |                  |
#     |   perturbation   |
#     |    (T, p)        |
#     |                  |
#     |                  |
#     --------------------
#         bottom (y=-10 km, T=450 K)
#
# This simulation models coupled THM processes without any fault:
# - Initial thermal and pressure perturbation at depth
# - Coupled thermal-hydraulic-mechanical response
# - Heat and pressure diffusion toward equilibrium
#
# Boundary conditions:
# - Fixed horizontal displacement on left/right boundaries
# - Fixed vertical displacement on bottom boundary
# - Free top boundary (traction-free)
# - Zero pressure on top (drained)
# - Fixed temperature at surface (300 K) and bottom (450 K)
#
base = [pylithapp.cfg]
description = Thermoporoelasticity without fault - coupled THM equilibration.
authors = [PyLith Development Team]
keywords = [thermoporoelasticity, THM coupling, no fault, thermal diffusion, pressure diffusion]
arguments = [step01_no_fault.cfg]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

features = [
    Quasistatic simulation,
    Thermoporoelasticity,
    Coupled THM,
    pylith.problems.SolnDispPresTracStrainTemp
    ]

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
defaults.name = step01_no_fault

# For thermoporoelasticity without a fault, we use displacement, pressure,
# trace_strain, and temperature
solution = pylith.problems.SolnDispPresTracStrainTemp

# Simulation time
initial_dt = 100.0*year
start_time = 0.0*year
end_time = 10000.0*year

# ----------------------------------------------------------------------
# solution
# ----------------------------------------------------------------------
[pylithapp.problem.solution.subfields.displacement]
basis_order = 2

[pylithapp.problem.solution.subfields.pressure]
basis_order = 1

[pylithapp.problem.solution.subfields.trace_strain]
basis_order = 1

[pylithapp.problem.solution.subfields.temperature]
basis_order = 1

# ----------------------------------------------------------------------
# initial conditions
# ----------------------------------------------------------------------
# Use perturbed initial conditions with elevated temperature and pressure
[pylithapp.problem.ic.temperature_ic]
db = spatialdata.spatialdb.SimpleGridDB
db.description = Initial temperature with perturbation
db.filename = initial_temperature_perturbed.spatialdb
db.query_type = linear

[pylithapp.problem.ic.pressure_ic]
db = spatialdata.spatialdb.SimpleGridDB
db.description = Initial pressure with perturbation
db.filename = initial_pressure_perturbed.spatialdb
db.query_type = linear

# ----------------------------------------------------------------------
# output
# ----------------------------------------------------------------------
[pylithapp.problem.solution_observers.domain]
data_fields = [displacement, pressure, temperature]
trigger.num_skip = 9

[pylithapp.problem.materials.crust.observers.observer]
data_fields = [cauchy_stress, cauchy_strain, porosity]

# End of file
