[pylithapp.metadata]
#  y (up)
#  ^
#  |
#   --> x
#
#         surface (y=0, T=300 K)
#     --------------------
#     |         |        |
#     |         |fault   |
#     |  slip<--|        |
#     |         *        |  <- fault tip at 15 km depth
#     |                  |
#     --------------------
#         bottom (y=-20 km, T=600 K)
#
# This simulation models coseismic slip on a strike-slip fault with
# thermoelastic coupling. The slip generates shear heating on the fault
# and the heat conducts into the surrounding rock.
#
# Boundary conditions:
# - Fixed displacement on all boundaries
# - Fixed temperature at surface (300 K) and bottom (600 K)
#
# Fault:
# - Prescribed left-lateral slip of 2 m (step function)
# - Slip generates shear heating proportional to slip rate × shear stress
#
base = [pylithapp.cfg]
description = Coseismic slip with shear heating and heat conduction.
authors = [PyLith Development Team]
keywords = [coseismic slip, shear heating, thermoelasticity, heat conduction]
arguments = [step01_coseismic.cfg]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

features = [
    Quasistatic simulation,
    Thermoelasticity,
    Shear heating,
    Kinematic fault,
    spatialdata.spatialdb.SimpleGridDB
    ]

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
defaults.name = step01_coseismic

# Simulation time for coseismic and initial post-seismic period
initial_dt = 1.0*year
start_time = -1.0*year
end_time = 100.0*year

# Use a nonuniform time stepping where we use smaller time steps
# immediately after the earthquake
[pylithapp.problem.time_stepping]
enable_adaptive_time_stepping = False

# ----------------------------------------------------------------------
# fault
# ----------------------------------------------------------------------
[pylithapp.problem.interfaces.fault]
# Use step function for instantaneous coseismic slip
eq_ruptures = [rupture]

[pylithapp.problem.interfaces.fault.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = Fault rupture auxiliary field spatial database
db_auxiliary_field.filename = fault_slip.spatialdb
db_auxiliary_field.query_type = linear

# Earthquake occurs at t=0
origin_time = 0.0*year

# ----------------------------------------------------------------------
# output
# ----------------------------------------------------------------------
# Output the solution at multiple times to see heat diffusion
[pylithapp.problem.solution_observers.domain]
data_fields = [displacement, temperature]
trigger.num_skip = 0

# Output fault information
[pylithapp.problem.interfaces.fault.observers.observer]
data_fields = [slip, traction_change]

# Output material information (includes heat source if enabled)
[pylithapp.problem.materials.crust_xneg.observers.observer]
data_fields = [cauchy_stress, cauchy_strain]

[pylithapp.problem.materials.crust_xpos.observers.observer]
data_fields = [cauchy_stress, cauchy_strain]

# End of file
