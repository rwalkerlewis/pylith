[pylithapp.metadata]
#  y (up)
#  ^
#  |
#   --> x
#
#         surface (y=0, T=300 K)
#     --------------------
#     |         |        |
#     |         |fault   |
#     |         |        |
#     |         *        |  <- fault tip at 15 km depth
#     |                  |
#     --------------------
#         bottom (y=-20 km, T=600 K)
#
# This simulation models post-seismic heat diffusion after the coseismic
# slip. The earthquake has already occurred and generated heat on the fault.
# This step shows the longer-term heat conduction away from the fault zone.
#
# This is a continuation of step01, showing how the temperature anomaly
# created by shear heating diffuses over geological time scales.
#
# Boundary conditions:
# - Fixed displacement on all boundaries
# - Fixed temperature at surface (300 K) and bottom (600 K)
#
# Fault:
# - No additional slip (locked fault)
# - Heat diffuses from the fault zone into surrounding rock
#
base = [pylithapp.cfg]
description = Post-seismic heat diffusion (no fault slip).
authors = [PyLith Development Team]
keywords = [post-seismic, heat diffusion, thermoelasticity, heat conduction]
arguments = [step02_postseismic.cfg]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

features = [
    Quasistatic simulation,
    Thermoelasticity,
    Heat conduction
    ]

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
defaults.name = step02_postseismic

# Long-term simulation for heat diffusion (1000 years)
initial_dt = 10.0*year
start_time = 0.0*year
end_time = 1000.0*year

# ----------------------------------------------------------------------
# fault
# ----------------------------------------------------------------------
# For post-seismic, we still have the fault but with zero slip
[pylithapp.problem.interfaces.fault]
eq_ruptures = [rupture]

[pylithapp.problem.interfaces.fault.eq_ruptures.rupture]
# Zero slip - fault is locked
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Locked fault (zero slip)
db_auxiliary_field.values = [initiation_time, final_slip_left_lateral, final_slip_opening]
db_auxiliary_field.data = [0.0*s, 0.0*m, 0.0*m]

origin_time = 0.0*year

# ----------------------------------------------------------------------
# initial conditions
# ----------------------------------------------------------------------
# Start with elevated temperature near the fault from shear heating.
# In practice, you would restart from step01's final state.
# Here we use a simplified initial condition with a temperature anomaly.
[pylithapp.problem.ic.temperature_ic]
db = spatialdata.spatialdb.SimpleGridDB
db.description = Initial temperature with fault heating anomaly
db.filename = initial_temperature_heated.spatialdb
db.query_type = linear

# ----------------------------------------------------------------------
# output
# ----------------------------------------------------------------------
[pylithapp.problem.solution_observers.domain]
data_fields = [displacement, temperature]
# Output every 10 time steps to capture heat diffusion
trigger.num_skip = 9

# End of file
