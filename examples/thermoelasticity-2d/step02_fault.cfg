[pylithapp.metadata]
#  y (up)
#  ^
#  |
#   --> x
#
#         surface (y=0, T=300 K)
#     --------------------
#     |         |        |
#     |         |fault   |
#     |  slip<--|        |
#     |         *        |  <- fault tip at 15 km depth
#     |                  |
#     --------------------
#         bottom (y=-20 km, T=600 K)
#
# This simulation models coseismic slip on a strike-slip fault with
# thermoelastic coupling:
# - Prescribed left-lateral slip of 2 m (step function)
# - Thermal stresses from geothermal gradient
#
# Boundary conditions:
# - Fixed displacement on left/right/bottom boundaries
# - Fixed temperature at surface (300 K) and bottom (600 K)
#
base = [pylithapp.cfg]
description = Thermoelasticity with kinematic fault.
authors = [PyLith Development Team]
keywords = [thermoelasticity, kinematic fault, coseismic slip, thermal stress]
arguments = [step02_fault.cfg]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

features = [
    Quasistatic simulation,
    Thermoelasticity,
    Kinematic fault,
    pylith.faults.FaultCohesiveKin,
    pylith.problems.SolnDispTempLagrange
    ]

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
defaults.name = step02_fault

# For thermoelasticity with a fault, we need Lagrange multipliers
solution = pylith.problems.SolnDispTempLagrange

# Simulation time
initial_dt = 1.0*year
start_time = -1.0*year
end_time = 100.0*year

# ----------------------------------------------------------------------
# solution
# ----------------------------------------------------------------------
[pylithapp.problem.solution.subfields.displacement]
basis_order = 1

[pylithapp.problem.solution.subfields.temperature]
basis_order = 1

[pylithapp.problem.solution.subfields.lagrange_multiplier_fault]
basis_order = 1

# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
# We need two material blocks for the fault to separate them
[pylithapp.problem]
materials = [crust_xneg, crust_xpos]
materials.crust_xneg = pylith.materials.Thermoelasticity
materials.crust_xpos = pylith.materials.Thermoelasticity

# Material properties for negative-x side of fault
[pylithapp.problem.materials.crust_xneg]
description = Thermoelastic crust (x < 0)
label_value = 1

db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Thermoelastic material properties
db_auxiliary_field.values = [density, vs, vp, specific_heat, thermal_conductivity, reference_temperature, thermal_expansion_coefficient]
db_auxiliary_field.data = [2700.0*kg/m**3, 3500.0*m/s, 6000.0*m/s, 900.0*J/(kg*K), 3.0*W/(m*K), 300.0*K, 2.4e-5*1/K]

auxiliary_subfields.density.basis_order = 0
auxiliary_subfields.specific_heat.basis_order = 0
auxiliary_subfields.thermal_conductivity.basis_order = 0
auxiliary_subfields.reference_temperature.basis_order = 0
auxiliary_subfields.thermal_expansion_coefficient.basis_order = 0

bulk_rheology = pylith.materials.IsotropicLinearThermoelasticity
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0

derived_subfields.cauchy_strain.basis_order = 0
derived_subfields.cauchy_stress.basis_order = 0

# Material properties for positive-x side of fault
[pylithapp.problem.materials.crust_xpos]
description = Thermoelastic crust (x > 0)
label_value = 2

db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Thermoelastic material properties
db_auxiliary_field.values = [density, vs, vp, specific_heat, thermal_conductivity, reference_temperature, thermal_expansion_coefficient]
db_auxiliary_field.data = [2700.0*kg/m**3, 3500.0*m/s, 6000.0*m/s, 900.0*J/(kg*K), 3.0*W/(m*K), 300.0*K, 2.4e-5*1/K]

auxiliary_subfields.density.basis_order = 0
auxiliary_subfields.specific_heat.basis_order = 0
auxiliary_subfields.thermal_conductivity.basis_order = 0
auxiliary_subfields.reference_temperature.basis_order = 0
auxiliary_subfields.thermal_expansion_coefficient.basis_order = 0

bulk_rheology = pylith.materials.IsotropicLinearThermoelasticity
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0

derived_subfields.cauchy_strain.basis_order = 0
derived_subfields.cauchy_stress.basis_order = 0

# ----------------------------------------------------------------------
# fault
# ----------------------------------------------------------------------
[pylithapp.problem]
interfaces = [fault]

[pylithapp.problem.interfaces.fault]
# The `label` and `label_value` correspond to the name and tag of the
# physical group in the Gmsh Python script.
label = fault
label_value = 20

# Buried fault edge
edge = fault_edge
edge_value = 21

# Use step function for instantaneous coseismic slip
eq_ruptures = [rupture]

# Output slip and traction change
observers.observer.data_fields = [slip, traction_change]

[pylithapp.problem.interfaces.fault.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = Fault rupture auxiliary field spatial database
db_auxiliary_field.filename = fault_slip.spatialdb
db_auxiliary_field.query_type = linear

# Earthquake occurs at t=0
origin_time = 0.0*year

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
# Override to fix all displacement components on boundaries for fault case
[pylithapp.problem.bc.bc_left_disp]
constrained_dof = [0, 1]

[pylithapp.problem.bc.bc_right_disp]
constrained_dof = [0, 1]

[pylithapp.problem.bc.bc_bottom_disp]
constrained_dof = [0, 1]

# ----------------------------------------------------------------------
# PETSc
# ----------------------------------------------------------------------
[pylithapp.petsc]
# Add Lagrange multiplier field split
fieldsplit_lagrange_multiplier_fault_pc_type = lu

# ----------------------------------------------------------------------
# output
# ----------------------------------------------------------------------
[pylithapp.problem.solution_observers.domain]
data_fields = [displacement, temperature]
trigger.num_skip = 0

[pylithapp.problem.materials.crust_xneg.observers.observer]
data_fields = [cauchy_stress, cauchy_strain]

[pylithapp.problem.materials.crust_xpos.observers.observer]
data_fields = [cauchy_stress, cauchy_strain]

# End of file
