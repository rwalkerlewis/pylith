[pylithapp.metadata]
#  y (up)
#  ^
#  |
#   --> x
#
#         surface (y=0, T=300 K)
#     --------------------
#     |                  |
#     |    hot region    |
#     |    (initial)     |
#     |                  |
#     |                  |
#     --------------------
#         bottom (y=-20 km, T=600 K)
#
# This simulation models thermoelasticity without any fault:
# - Initial temperature perturbation (hot region at depth)
# - Heat conduction toward thermal equilibrium
# - Thermal stresses from temperature changes
#
# Boundary conditions:
# - Fixed horizontal displacement on left/right boundaries
# - Fixed vertical displacement on bottom boundary
# - Free top boundary (traction-free)
# - Fixed temperature at surface (300 K) and bottom (600 K)
#
base = [pylithapp.cfg]
description = Thermoelasticity without fault - thermal equilibration.
authors = [PyLith Development Team]
keywords = [thermoelasticity, thermal stress, heat conduction, no fault]
arguments = [step01_no_fault.cfg]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

features = [
    Quasistatic simulation,
    Thermoelasticity,
    Heat conduction,
    pylith.problems.SolnDispTemp
    ]

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
defaults.name = step01_no_fault

# For thermoelasticity without a fault, we use displacement and temperature
solution = pylith.problems.SolnDispTemp

# Simulation time for thermal equilibration
initial_dt = 10.0*year
start_time = 0.0*year
end_time = 500.0*year

# ----------------------------------------------------------------------
# solution
# ----------------------------------------------------------------------
[pylithapp.problem.solution.subfields.displacement]
basis_order = 1

[pylithapp.problem.solution.subfields.temperature]
basis_order = 1

# ----------------------------------------------------------------------
# initial conditions
# ----------------------------------------------------------------------
# Use a perturbed temperature field with a hot region at depth
[pylithapp.problem.ic.temperature_ic]
db = spatialdata.spatialdb.SimpleGridDB
db.description = Initial temperature with hot perturbation
db.filename = initial_temperature_perturbed.spatialdb
db.query_type = linear

# ----------------------------------------------------------------------
# output
# ----------------------------------------------------------------------
[pylithapp.problem.solution_observers.domain]
data_fields = [displacement, temperature]
trigger.num_skip = 4

[pylithapp.problem.materials.crust.observers.observer]
data_fields = [cauchy_stress, cauchy_strain]

# End of file
