[pylithapp.metadata]
description = Thermoporoelasticity constant solution (no faults).
authors = [PyLith CI]
keywords = [thermoporoelasticity, no faults]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
initial_dt = 1.0*s
start_time = 0.0*s
end_time = 0.0*s

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem]
bc = [
    bc_disp_xneg,
    bc_disp_xpos,
    bc_disp_yneg,
    bc_disp_ypos,
    bc_press_ypos,
    bc_temp_xneg,
    bc_temp_xpos
]

bc.bc_disp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_xpos = pylith.bc.DirichletTimeDependent
bc.bc_disp_yneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_ypos = pylith.bc.DirichletTimeDependent
bc.bc_press_ypos = pylith.bc.DirichletTimeDependent
bc.bc_temp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_temp_xpos = pylith.bc.DirichletTimeDependent

[pylithapp.problem.bc.bc_disp_xneg]
constrained_dof = [0]
label = boundary_xneg
label_value = 10
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_xpos]
constrained_dof = [0]
label = boundary_xpos
label_value = 11
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_yneg]
constrained_dof = [1]
label = boundary_yneg
label_value = 12
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_ypos]
constrained_dof = [1]
label = boundary_ypos
label_value = 13
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_press_ypos]
field = pressure
constrained_dof = [0]
label = boundary_ypos
label_value = 13
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_temp_xneg]
field = temperature
constrained_dof = [0]
label = boundary_xneg
label_value = 10

# Constant temperature
[pylithapp.problem.bc.bc_temp_xneg.db_auxiliary_field]
description = Dirichlet temperature BC -x boundary
type = spatialdata.spatialdb.UniformDB
values = [initial_amplitude]
data = [300.0*K]

[pylithapp.problem.bc.bc_temp_xpos]
field = temperature
constrained_dof = [0]
label = boundary_xpos
label_value = 11

[pylithapp.problem.bc.bc_temp_xpos.db_auxiliary_field]
description = Dirichlet temperature BC +x boundary
type = spatialdata.spatialdb.UniformDB
values = [initial_amplitude]
data = [300.0*K]

# End of file
