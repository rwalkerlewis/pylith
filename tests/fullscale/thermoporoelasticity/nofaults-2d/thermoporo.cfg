[pylithapp.metadata]
description = Thermoporoelasticity constant solution (no faults).
authors = [PyLith CI]
keywords = [thermoporoelasticity, no faults]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
initial_dt = 1.0*s
start_time = 0.0*s
end_time = 1.0*s

# ----------------------------------------------------------------------
# initial conditions
# ----------------------------------------------------------------------
# Set initial temperature to 300K and pressure to 0 everywhere
ic = [temperature_ic, pressure_ic]
ic.temperature_ic = pylith.problems.InitialConditionDomain
ic.pressure_ic = pylith.problems.InitialConditionDomain

[pylithapp.problem.ic.temperature_ic]
subfields = [temperature]
db = spatialdata.spatialdb.UniformDB
db.description = Initial temperature
db.values = [temperature]
db.data = [300.0*K]

[pylithapp.problem.ic.pressure_ic]
subfields = [pressure]
db = spatialdata.spatialdb.UniformDB
db.description = Initial pressure
db.values = [pressure]
db.data = [0.0*Pa]

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem]
bc = [bc_disp_xneg, bc_disp_xpos, bc_disp_yneg, bc_disp_ypos, bc_press_ypos, bc_temp_xneg, bc_temp_xpos]

bc.bc_disp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_xpos = pylith.bc.DirichletTimeDependent
bc.bc_disp_yneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_ypos = pylith.bc.DirichletTimeDependent
bc.bc_press_ypos = pylith.bc.DirichletTimeDependent
bc.bc_temp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_temp_xpos = pylith.bc.DirichletTimeDependent

[pylithapp.problem.bc.bc_disp_xneg]
constrained_dof = [0]
label = boundary_xneg
label_value = 10
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC -x edge

[pylithapp.problem.bc.bc_disp_xpos]
constrained_dof = [0]
label = boundary_xpos
label_value = 11
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC +x edge

[pylithapp.problem.bc.bc_disp_yneg]
constrained_dof = [1]
label = boundary_yneg
label_value = 12
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC -y edge

[pylithapp.problem.bc.bc_disp_ypos]
constrained_dof = [1]
label = boundary_ypos
label_value = 13
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC +y edge

[pylithapp.problem.bc.bc_press_ypos]
field = pressure
constrained_dof = [0]
label = boundary_ypos
label_value = 13
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet pressure BC +y edge

[pylithapp.problem.bc.bc_temp_xneg]
field = temperature
constrained_dof = [0]
label = boundary_xneg
label_value = 10
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Dirichlet temperature BC -x boundary
db_auxiliary_field.values = [initial_amplitude]
db_auxiliary_field.data = [300.0*K]

[pylithapp.problem.bc.bc_temp_xpos]
field = temperature
constrained_dof = [0]
label = boundary_xpos
label_value = 11
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Dirichlet temperature BC +x boundary
db_auxiliary_field.values = [initial_amplitude]
db_auxiliary_field.data = [300.0*K]

# End of file
