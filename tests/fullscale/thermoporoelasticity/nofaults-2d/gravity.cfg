[pylithapp.metadata]
description = Thermoporoelasticity with gravitational body forces and temperature gradient.
authors = [PyLith CI]
keywords = [thermoporoelasticity, gravity, temperature gradient]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

features = [Static simulation, pylith.materials.IsotropicLinearThermoporoelasticity, pylith.bc.DirichletTimeDependent, pylith.bc.ZeroDB]


# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
gravity_field = spatialdata.spatialdb.GravityField
gravity_field.gravity_dir = [0.0, -1.0, 0.0]

[pylithapp.problem]
initial_dt = 1.0*year
start_time = -1.0*year
end_time = 15.0*year

# ----------------------------------------------------------------------
# initial conditions
# ----------------------------------------------------------------------
# Set initial temperature gradient and hydrostatic pressure
ic = [temperature_ic, pressure_ic]
ic.temperature_ic = pylith.problems.InitialConditionDomain
ic.pressure_ic = pylith.problems.InitialConditionDomain

[pylithapp.problem.ic.temperature_ic]
subfields = [temperature]
db = spatialdata.spatialdb.SimpleDB
db.description = Initial temperature (geothermal gradient)
db.query_type = linear
db.iohandler.filename = gravity_temperature_ic.spatialdb

[pylithapp.problem.ic.pressure_ic]
subfields = [pressure]
db = spatialdata.spatialdb.SimpleDB
db.description = Initial pressure (hydrostatic)
db.query_type = linear
db.iohandler.filename = gravity_pressure_ic.spatialdb


# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
[pylithapp.problem.materials.thermoporoelastic]
auxiliary_subfields.gravitational_acceleration.basis_order = 0


# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem]
bc = [bc_disp_xneg, bc_disp_xpos, bc_disp_yneg, bc_press_ypos, bc_temp_ypos]
bc.bc_disp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_xpos = pylith.bc.DirichletTimeDependent
bc.bc_disp_yneg = pylith.bc.DirichletTimeDependent
bc.bc_press_ypos = pylith.bc.DirichletTimeDependent
bc.bc_temp_ypos = pylith.bc.DirichletTimeDependent

[pylithapp.problem.bc.bc_disp_xpos]
constrained_dof = [0]
label = boundary_xpos
label_value = 11
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC +x edge

[pylithapp.problem.bc.bc_disp_xneg]
constrained_dof = [0]
label = boundary_xneg
label_value = 10
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC -x edge

[pylithapp.problem.bc.bc_disp_yneg]
constrained_dof = [1]
label = boundary_yneg
label_value = 12
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC -y edge

[pylithapp.problem.bc.bc_press_ypos]
field = pressure
constrained_dof = [0]
label = boundary_ypos
label_value = 13
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet pressure BC +y edge

[pylithapp.problem.bc.bc_temp_ypos]
field = temperature
constrained_dof = [0]
label = boundary_ypos
label_value = 13
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Dirichlet temperature BC +y boundary (surface)
db_auxiliary_field.values = [initial_amplitude]
db_auxiliary_field.data = [300.0*K]


# End of file
