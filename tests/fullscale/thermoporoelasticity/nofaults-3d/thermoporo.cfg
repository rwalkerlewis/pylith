[pylithapp.metadata]
description = Thermoporoelasticity constant solution (3D, no faults).
authors = [PyLith CI]
keywords = [thermoporoelasticity, no faults, 3D]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

[pylithapp.problem]
initial_dt = 1.0*s
start_time = 0.0*s
end_time = 0.0*s

# ----------------------------------------------------------------------
# initial conditions
# ----------------------------------------------------------------------
# Set initial temperature to 300K and pressure to 0 everywhere
ic = [temperature_ic, pressure_ic]
ic.temperature_ic = pylith.problems.InitialConditionDomain
ic.pressure_ic = pylith.problems.InitialConditionDomain

[pylithapp.problem.ic.temperature_ic]
subfields = [temperature]
db = spatialdata.spatialdb.UniformDB
db.description = Initial temperature
db.values = [temperature]
db.data = [300.0*K]

[pylithapp.problem.ic.pressure_ic]
subfields = [pressure]
db = spatialdata.spatialdb.UniformDB
db.description = Initial pressure
db.values = [pressure]
db.data = [0.0*Pa]

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem]
bc = [
    bc_disp_xneg,
    bc_disp_xpos,
    bc_disp_yneg,
    bc_disp_ypos,
    bc_disp_zneg,
    bc_press_xneg,
    bc_press_xpos,
    bc_temp_xneg,
    bc_temp_xpos
    ]

bc.bc_disp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_xpos = pylith.bc.DirichletTimeDependent
bc.bc_disp_yneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_ypos = pylith.bc.DirichletTimeDependent
bc.bc_disp_zneg = pylith.bc.DirichletTimeDependent
bc.bc_press_xneg = pylith.bc.DirichletTimeDependent
bc.bc_press_xpos = pylith.bc.DirichletTimeDependent
bc.bc_temp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_temp_xpos = pylith.bc.DirichletTimeDependent

[pylithapp.problem.bc.bc_disp_xneg]
constrained_dof = [0]
label = boundary_xneg
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_xpos]
constrained_dof = [0]
label = boundary_xpos
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_yneg]
constrained_dof = [1]
label = boundary_yneg
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_ypos]
constrained_dof = [1]
label = boundary_ypos
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_zneg]
constrained_dof = [2]
label = boundary_zneg
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_press_xneg]
field = pressure
constrained_dof = [0]
label = boundary_xneg
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_press_xpos]
field = pressure
constrained_dof = [0]
label = boundary_xpos
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_temp_xneg]
field = temperature
constrained_dof = [0]
label = boundary_xneg

[pylithapp.problem.bc.bc_temp_xneg.db_auxiliary_field]
type = spatialdata.spatialdb.UniformDB
values = [initial_amplitude]
data = [300.0*K]

[pylithapp.problem.bc.bc_temp_xpos]
field = temperature
constrained_dof = [0]
label = boundary_xpos

[pylithapp.problem.bc.bc_temp_xpos.db_auxiliary_field]
type = spatialdata.spatialdb.UniformDB
values = [initial_amplitude]
data = [300.0*K]

# End of file
