[pylithapp.metadata]
keywords = [full-scale test, thermoporoelasticity, 3D, no faults]
features = [
    Quasistatic simulation,
    pylith.materials.Thermoporoelasticity,
    pylith.materials.IsotropicLinearThermoporoelasticity,
    pylith.problems.SolnDispPresTracStrainTemp,
    pylith.meshio.MeshIOCubit,
    pylith.meshio.DataWriterHDF5
    ]

[pylithapp.launcher] # WARNING: THIS IS NOT PORTABLE
command = mpiexec -np ${nodes}

# ----------------------------------------------------------------------
# mesh
# ----------------------------------------------------------------------
[pylithapp.mesh_generator]
reader = pylith.meshio.MeshIOCubit

[pylithapp.mesh_generator.reader]
coordsys.space_dim = 3

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
# Scales mostly matter for the coupled pressure solve.
scales = pylith.scales.QuasistaticPoroelasticity
scales.length_scale = 8.0*km
scales.displacement_scale = 1.0*m
scales.shear_modulus = 30.0*GPa
scales.viscosity = 0.001*Pa*s
scales.permeability = 1.0e-14*m**2

solution = pylith.problems.SolnDispPresTracStrainTemp

defaults.quadrature_order = 2

[pylithapp.problem.solution.subfields]
displacement.basis_order = 1
pressure.basis_order = 1
trace_strain.basis_order = 1
temperature.basis_order = 1

[pylithapp.problem]
solution_observers = [domain]

# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
[pylithapp.problem]
materials = [upper_crust, lower_crust]
materials.upper_crust = pylith.materials.Thermoporoelasticity
materials.lower_crust = pylith.materials.Thermoporoelasticity

[pylithapp.problem.materials.upper_crust]
label_value = 1

[pylithapp.problem.materials.lower_crust]
label_value = 2

[pylithapp.problem.materials.upper_crust]
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.values = [
    solid_density,
    fluid_density,
    fluid_viscosity,
    porosity,
    shear_modulus,
    drained_bulk_modulus,
    biot_coefficient,
    fluid_bulk_modulus,
    isotropic_permeability,
    specific_heat,
    thermal_conductivity,
    reference_temperature,
    thermal_expansion_coefficient,
    fluid_thermal_expansion
    ]
db_auxiliary_field.data = [
    2500*kg/m**3,
    1000*kg/m**3,
    1.0e-3*Pa*s,
    0.02,
    30.0*GPa,
    80.0*GPa,
    0.7,
    10.0*GPa,
    1.0e-14*m**2,
    1000.0*J/(kg*K),
    3.0*watt/(m*K),
    300.0*K,
    1.0e-5*1/K,
    3.0e-4*1/K
    ]

[pylithapp.problem.materials.lower_crust]
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.values = ${pylithapp.problem.materials.upper_crust.db_auxiliary_field.values}
db_auxiliary_field.data = ${pylithapp.problem.materials.upper_crust.db_auxiliary_field.data}

# ----------------------------------------------------------------------
# PETSc
# ----------------------------------------------------------------------
[pylithapp.problem.petsc_defaults]
solver = True
testing = True
monitors = False

[pylithapp.petsc]
snes_max_it = 3
ksp_atol = 1.0e-10

# End of file
