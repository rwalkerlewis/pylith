[pylithapp.metadata]
description = Thermoporoelasticity with gravitational body forces and temperature gradient (3D).
authors = [PyLith CI]
keywords = [thermoporoelasticity, gravity, temperature gradient, 3D]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

features = [
    Static simulation,
    pylith.materials.IsotropicLinearThermoporoelasticity,
    pylith.bc.DirichletTimeDependent,
    pylith.bc.ZeroDB
    ]


# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
gravity_field = spatialdata.spatialdb.GravityField
gravity_field.gravity_dir = [0.0, 0.0, -1.0]

[pylithapp.problem]
initial_dt = 1.0*year
start_time = -1.0*year
end_time = 15.0*year


# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
[pylithapp.problem.materials.upper_crust]
auxiliary_subfields.gravitational_acceleration.basis_order = 0

[pylithapp.problem.materials.lower_crust]
auxiliary_subfields.gravitational_acceleration.basis_order = 0


# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem]
bc = [bc_disp_xneg, bc_disp_xpos, bc_disp_yneg, bc_disp_ypos, bc_disp_zneg, bc_press_zpos, bc_temp_zpos]
bc.bc_disp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_xpos = pylith.bc.DirichletTimeDependent
bc.bc_disp_yneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_ypos = pylith.bc.DirichletTimeDependent
bc.bc_disp_zneg = pylith.bc.DirichletTimeDependent
bc.bc_press_zpos = pylith.bc.DirichletTimeDependent
bc.bc_temp_zpos = pylith.bc.DirichletTimeDependent

[pylithapp.problem.bc.bc_disp_xpos]
constrained_dof = [0]
label = boundary_xpos
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC +x face

[pylithapp.problem.bc.bc_disp_xneg]
constrained_dof = [0]
label = boundary_xneg
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC -x face

[pylithapp.problem.bc.bc_disp_ypos]
constrained_dof = [1]
label = boundary_ypos
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC +y face

[pylithapp.problem.bc.bc_disp_yneg]
constrained_dof = [1]
label = boundary_yneg
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC -y face

[pylithapp.problem.bc.bc_disp_zneg]
constrained_dof = [2]
label = boundary_zneg
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC -z face

[pylithapp.problem.bc.bc_press_zpos]
field = pressure
constrained_dof = [0]
label = boundary_zpos
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet pressure BC +z face

[pylithapp.problem.bc.bc_temp_zpos]
field = temperature
constrained_dof = [0]
label = boundary_zpos

[pylithapp.problem.bc.bc_temp_zpos.db_auxiliary_field]
description = Dirichlet temperature BC +z face (surface)
type = spatialdata.spatialdb.UniformDB
values = [initial_amplitude]
data = [300.0*K]


# End of file
