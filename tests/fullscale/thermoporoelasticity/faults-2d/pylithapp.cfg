[pylithapp.metadata]
keywords = [full-scale test, thermoporoelasticity, 2D, fault]
features = [
    Quasistatic simulation,
    pylith.materials.Thermoporoelasticity,
    pylith.materials.IsotropicLinearThermoporoelasticity,
    pylith.problems.SolnDispPresTracStrainTempLagrange,
    pylith.faults.FaultCohesiveKin,
    pylith.faults.KinSrcStep,
    pylith.meshio.MeshIOPetsc,
    pylith.meshio.DataWriterHDF5
]

[pylithapp.launcher] # WARNING: THIS IS NOT PORTABLE
command = mpiexec -np ${nodes}

# ----------------------------------------------------------------------
# mesh
# ----------------------------------------------------------------------
[pylithapp.mesh_generator]
reader = pylith.meshio.MeshIOPetsc

[pylithapp.mesh_generator.reader]
coordsys.space_dim = 2

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
scales = pylith.scales.QuasistaticThermoporoelasticity
scales.length_scale = 1.0*km
scales.displacement_scale = 1.0*m
scales.shear_modulus = 30.0*GPa
scales.viscosity = 0.001*Pa*s
scales.permeability = 1.0e-14*m**2
scales.thermal_conductivity = 3.0*watt/(m*K)
scales.density = 2500.0*kg/m**3
scales.specific_heat = 1000.0*J/(kg*K)
scales.temperature_scale = 1.0*K

solution = pylith.problems.SolnDispPresTracStrainTempLagrange

defaults.quadrature_order = 2

[pylithapp.problem.solution.subfields]
displacement.basis_order = 2
pressure.basis_order = 1
trace_strain.basis_order = 1
temperature.basis_order = 1
lagrange_multiplier_fault.basis_order = 2

[pylithapp.problem]
solution_observers = [domain]

# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
[pylithapp.problem]
materials = [thermoporoelastic]
materials.thermoporoelastic = pylith.materials.Thermoporoelasticity

[pylithapp.problem.materials.thermoporoelastic]
label_value = 1

db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Thermoporoelastic properties
db_auxiliary_field.values = [
    solid_density,
    fluid_density,
    fluid_viscosity,
    porosity,
    shear_modulus,
    drained_bulk_modulus,
    biot_coefficient,
    fluid_bulk_modulus,
    isotropic_permeability,
    specific_heat,
    thermal_conductivity,
    reference_temperature,
    thermal_expansion_coefficient,
    fluid_thermal_expansion
]
db_auxiliary_field.data = [
    2500*kg/m**3,
    1000*kg/m**3,
    1.0e-3*Pa*s,
    0.02,
    30.0*GPa,
    80.0*GPa,
    0.7,
    10.0*GPa,
    1.0e-14*m**2,
    1000.0*J/(kg*K),
    3.0*watt/(m*K),
    300.0*K,
    1.0e-5*1/K,
    3.0e-4*1/K
]

[pylithapp.problem.materials.thermoporoelastic.bulk_rheology]
auxiliary_subfields.shear_modulus.basis_order = 0
auxiliary_subfields.drained_bulk_modulus.basis_order = 0
auxiliary_subfields.biot_coefficient.basis_order = 0
auxiliary_subfields.biot_modulus.basis_order = 0
auxiliary_subfields.isotropic_permeability.basis_order = 0
auxiliary_subfields.reference_temperature.basis_order = 0
auxiliary_subfields.thermal_expansion_coefficient.basis_order = 0
auxiliary_subfields.fluid_thermal_expansion.basis_order = 0
auxiliary_subfields.thermal_conductivity.basis_order = 0
auxiliary_subfields.specific_heat.basis_order = 0

# ----------------------------------------------------------------------
# faults
# ----------------------------------------------------------------------
[pylithapp.problem]
interfaces = [fault]

[pylithapp.problem.interfaces.fault]
label = fault
label_value = 20

# ----------------------------------------------------------------------
# PETSc
# ----------------------------------------------------------------------
[pylithapp.problem.petsc_defaults]
solver = True
testing = True
monitors = False

[pylithapp.petsc]
snes_max_it = 3
ksp_atol = 1.0e-10

# End of file
