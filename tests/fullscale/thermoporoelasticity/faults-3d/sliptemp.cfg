[pylithapp.metadata]
description = Thermoporoelasticity with prescribed slip and temperature gradient (3D).
authors = [PyLith CI]
keywords = [thermoporoelasticity, fault, prescribed slip, temperature gradient, 3D]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
initial_dt = 1.0*s
start_time = 0.0*s
end_time = 0.0*s

# ----------------------------------------------------------------------
# fault kinematics (left-lateral slip)
# ----------------------------------------------------------------------
[pylithapp.problem.interfaces.fault.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Fault rupture auxiliary field

db_auxiliary_field.values = [initiation_time, final_slip_left_lateral, final_slip_reverse, final_slip_opening]
db_auxiliary_field.data = [0.0*s, 2.0*m, 0.0*m, 0.0*m]

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem]
bc = [
    bc_disp_xneg,
    bc_disp_xpos,
    bc_disp_yneg,
    bc_disp_ypos,
    bc_disp_zneg,
    bc_press_xneg,
    bc_press_xpos,
    bc_temp_xneg,
    bc_temp_xpos
]

bc.bc_disp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_xpos = pylith.bc.DirichletTimeDependent
bc.bc_disp_yneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_ypos = pylith.bc.DirichletTimeDependent
bc.bc_disp_zneg = pylith.bc.DirichletTimeDependent
bc.bc_press_xneg = pylith.bc.DirichletTimeDependent
bc.bc_press_xpos = pylith.bc.DirichletTimeDependent
bc.bc_temp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_temp_xpos = pylith.bc.DirichletTimeDependent

[pylithapp.problem.bc.bc_disp_xneg]
constrained_dof = [0]
label = boundary_xneg
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_xpos]
constrained_dof = [0]
label = boundary_xpos
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_yneg]
constrained_dof = [1]
label = boundary_yneg
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_ypos]
constrained_dof = [1]
label = boundary_ypos
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_zneg]
constrained_dof = [2]
label = boundary_zneg
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_press_xneg]
field = pressure
constrained_dof = [0]
label = boundary_xneg
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_press_xpos]
field = pressure
constrained_dof = [0]
label = boundary_xpos
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_temp_xneg]
field = temperature
constrained_dof = [0]
label = boundary_xneg

[pylithapp.problem.bc.bc_temp_xneg.db_auxiliary_field]
description = Dirichlet temperature BC -x boundary
type = spatialdata.spatialdb.UniformDB
values = [initial_amplitude]
data = [350.0*K]

[pylithapp.problem.bc.bc_temp_xpos]
field = temperature
constrained_dof = [0]
label = boundary_xpos

[pylithapp.problem.bc.bc_temp_xpos.db_auxiliary_field]
description = Dirichlet temperature BC +x boundary
type = spatialdata.spatialdb.UniformDB
values = [initial_amplitude]
data = [300.0*K]

# End of file
