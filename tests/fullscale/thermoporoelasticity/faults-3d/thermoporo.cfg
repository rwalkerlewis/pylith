[pylithapp.metadata]
description = Thermoporoelasticity constant solution with a fault (3D, zero slip).
authors = [PyLith CI]
keywords = [thermoporoelasticity, fault, 3D]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

[pylithapp.problem]
initial_dt = 1.0*s
start_time = 0.0*s
end_time = 0.0*s

# ----------------------------------------------------------------------
# fault kinematics (zero slip)
# ----------------------------------------------------------------------
[pylithapp.problem.interfaces.fault.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.values = [initiation_time, final_slip_left_lateral, final_slip_opening]
db_auxiliary_field.data = [0.0*s, 0.0*m, 0.0*m]

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem]
bc = [
    bc_disp_xneg,
    bc_disp_xpos,
    bc_disp_yneg,
    bc_disp_ypos,
    bc_disp_zneg,
    bc_disp_zpos,
    bc_press_xneg,
    bc_press_xpos,
    bc_temp_xneg,
    bc_temp_xpos
]

bc.bc_disp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_xpos = pylith.bc.DirichletTimeDependent
bc.bc_disp_yneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_ypos = pylith.bc.DirichletTimeDependent
bc.bc_disp_zneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_zpos = pylith.bc.DirichletTimeDependent
bc.bc_press_xneg = pylith.bc.DirichletTimeDependent
bc.bc_press_xpos = pylith.bc.DirichletTimeDependent
bc.bc_temp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_temp_xpos = pylith.bc.DirichletTimeDependent

[pylithapp.problem.bc.bc_disp_xneg]
constrained_dof = [0]
label = boundary_xneg
label_value = 10
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_xpos]
constrained_dof = [0]
label = boundary_xpos
label_value = 11
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_yneg]
constrained_dof = [1]
label = boundary_yneg
label_value = 12
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_ypos]
constrained_dof = [1]
label = boundary_ypos
label_value = 13
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_zneg]
constrained_dof = [2]
label = boundary_zneg
label_value = 14
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_disp_zpos]
constrained_dof = [2]
label = boundary_zpos
label_value = 15
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_press_xneg]
field = pressure
constrained_dof = [0]
label = boundary_xneg
label_value = 10
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_press_xpos]
field = pressure
constrained_dof = [0]
label = boundary_xpos
label_value = 11
db_auxiliary_field = pylith.bc.ZeroDB

[pylithapp.problem.bc.bc_temp_xneg]
field = temperature
constrained_dof = [0]
label = boundary_xneg
label_value = 10

[pylithapp.problem.bc.bc_temp_xneg.db_auxiliary_field]
type = spatialdata.spatialdb.UniformDB
values = [initial_amplitude]
data = [300.0*K]

[pylithapp.problem.bc.bc_temp_xpos]
field = temperature
constrained_dof = [0]
label = boundary_xpos
label_value = 11

[pylithapp.problem.bc.bc_temp_xpos.db_auxiliary_field]
type = spatialdata.spatialdb.UniformDB
values = [initial_amplitude]
data = [300.0*K]

# End of file
