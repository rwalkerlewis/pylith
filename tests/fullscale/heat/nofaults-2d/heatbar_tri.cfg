[pylithapp.metadata]
base = [pylithapp.cfg]
description = Heat conduction in a bar with triangular mesh.
authors = [PyLith Development Team]
keywords = [full-scale test, 2D, heat conduction, triangular mesh]
arguments = [heatbar_tri.cfg]
version = 1.0.0

[pylithapp.problem.defaults]
name = heatbar_tri

[pylithapp.mesh_generator.reader]
filename = mesh_tri.mesh

[pylithapp.problem.solution_observers.domain]
trigger.num_skip = 0
data_fields = [temperature]
writer.filename = output/heatbar_tri-domain.h5

# End of file
