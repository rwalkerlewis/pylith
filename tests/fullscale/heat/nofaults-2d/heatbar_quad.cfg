[pylithapp.metadata]
base = [pylithapp.cfg]
description = Heat conduction in a bar with quadrilateral mesh.
authors = [PyLith Development Team]
keywords = [full-scale test, 2D, heat conduction, quadrilateral mesh]
arguments = [heatbar_quad.cfg]
version = 1.0.0

[pylithapp.problem.defaults]
name = heatbar_quad

[pylithapp.mesh_generator.reader]
filename = mesh_quad.mesh

[pylithapp.problem.solution_observers.domain]
trigger.num_skip = 0
data_fields = [temperature]
writer.filename = output/heatbar_quad-domain.h5

# End of file
