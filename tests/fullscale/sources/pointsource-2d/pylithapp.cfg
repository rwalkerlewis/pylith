[pylithapp.metadata]
keywords = [full-scale test, sources, point source, 2D]
features = [
    pylith.meshio.MeshIOCubit,
    pylith.problems.TimeDependent,
    pylith.problems.SolnDispVel,
    pylith.materials.Elasticity,
    pylith.materials.IsotropicLinearElasticity,
    pylith.sources.MomentTensorForce,
    pylith.sources.RickerWavelet,
    pylith.meshio.DataWriterHDF5,
    spatialdata.units.NondimElasticDynamic,
]

[pylithapp]
problem.defaults.name = pointsource_ricker

[pylithapp.mesh_generator]
reader = pylith.meshio.MeshIOCubit

[pylithapp.mesh_generator.reader]
filename = ../../../../examples/point-source/mesh_quad.exo
coordsys.space_dim = 2

[pylithapp.problem]
solver = linear
formulation = dynamic

normalizer = spatialdata.units.NondimElasticDynamic
normalizer.mass_density = 2500.0*kg/m**3
normalizer.shear_wave_speed = 1000.0*m/s
normalizer.wave_period = 1.0*s

defaults.quadrature_order = 1

solution = pylith.problems.SolnDispVel
solution.subfields.displacement.basis_order = 1
solution.subfields.velocity.basis_order = 1

start_time = 0.0*s
end_time = 0.05*s
initial_dt = 0.005*s

solution_observers = [domain]

[pylithapp.problem.solution_observers.domain]
writer = pylith.meshio.DataWriterHDF5
writer.filename = output/{name}-{mesh_entity}.h5

[pylithapp.problem.solution_observers.domain.output]
vertex_data_fields = [displacement, velocity]

[pylithapp.problem]
materials = [elastic]

[pylithapp.problem.materials.elastic]
description = Elastic material
label_value = 1
observers = []

db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Elastic properties
db_auxiliary_field.values = [density, vs, vp]
db_auxiliary_field.data = [1800*kg/m**3, 1.3*km/s, 3.0*km/s]

auxiliary_subfields.density.basis_order = 0
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0

[pylithapp.problem.petsc_defaults]
solver = True
testing = True
monitors = False

[pylithapp.petsc]
ts_type = rk
ts_rk_type = 3bs
ts_adapt_dt_max = 0.01

ksp_rtol = 1.0e-8
ksp_atol = 1.0e-12
ksp_max_it = 50
ksp_error_if_not_converged = true

# End of file

