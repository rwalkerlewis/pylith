[pylithapp.metadata]
pylith_version = [>=5.0, <6.0]
keywords = [full-scale test, thermoelasticity, 2D, fault]
features = [
    Quasistatic simulation,
    pylith.materials.Thermoelasticity,
    pylith.materials.IsotropicLinearThermoelasticity,
    pylith.problems.SolnDispTempLagrange,
    pylith.faults.FaultCohesiveKin,
    pylith.faults.KinSrcStep,
    pylith.meshio.MeshIOPetsc,
    pylith.meshio.DataWriterHDF5]

[pylithapp.launcher] # WARNING: THIS IS NOT PORTABLE
command = mpiexec -np ${nodes}

# ----------------------------------------------------------------------
# mesh
# ----------------------------------------------------------------------
[pylithapp.mesh_generator]
reader = pylith.meshio.MeshIOPetsc

[pylithapp.mesh_generator.reader]
coordsys.space_dim = 2

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
scales = pylith.scales.QuasistaticThermoelasticity
scales.length_scale = 1.0*km
scales.displacement_scale = 1.0*m
scales.shear_modulus = 22.5*GPa
scales.thermal_conductivity = 3.0
scales.density = 2500.0
scales.specific_heat = 1000.0
scales.temperature_scale = 1.0*K

solution = pylith.problems.SolnDispTempLagrange

[pylithapp.problem.defaults]
name = thermofault
quadrature_order = 2

[pylithapp.problem]
initial_dt = 1.0*s
start_time = 0.0*s
end_time = 1.0*s

[pylithapp.problem.solution.subfields]
displacement.basis_order = 2
temperature.basis_order = 1
lagrange_multiplier_fault.basis_order = 2

[pylithapp.problem]
solution_observers = [domain]

# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
[pylithapp.problem]
materials = [thermoelastic]
materials.thermoelastic = pylith.materials.Thermoelasticity

[pylithapp.problem.materials.thermoelastic]
label_value = 1

db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Thermoelastic material properties
db_auxiliary_field.values = [density, vs, vp, specific_heat, thermal_conductivity, reference_temperature, thermal_expansion_coefficient]
db_auxiliary_field.data = [2500.0*kg/m**3, 3000.0*m/s, 5196.0*m/s, 1000.0*J/(kg*K), 3.0*watt/(m*K), 300.0*K, 1.0e-5*1/K]

bulk_rheology = pylith.materials.IsotropicLinearThermoelasticity

# ----------------------------------------------------------------------
# fault
# ----------------------------------------------------------------------
[pylithapp.problem]
interfaces = [fault]

[pylithapp.problem.interfaces.fault]
label = fault
label_value = 20

# ----------------------------------------------------------------------
# PETSc
# ----------------------------------------------------------------------
[pylithapp.problem.petsc_defaults]
solver = True
testing = True
monitors = False

[pylithapp.petsc]
snes_max_it = 3
ksp_atol = 1.0e-10

# End of file
