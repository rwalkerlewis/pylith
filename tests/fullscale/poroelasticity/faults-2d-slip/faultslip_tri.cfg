[pylithapp.metadata]
description = Poroelasticity simulation with prescribed fault slip using triangular cells.
base = [pylithapp.cfg, faultslip.cfg]
keywords = [triangular cells]
arguments = [faultslip.cfg, faultslip_tri.cfg]

[pylithapp.problem]
defaults.name = faultslip_tri

[pylithapp.mesh_generator.reader]
filename = mesh_tri.msh

