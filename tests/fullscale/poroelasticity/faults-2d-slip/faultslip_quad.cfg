[pylithapp.metadata]
description = Poroelasticity simulation with prescribed fault slip using quadrilateral cells.
base = [pylithapp.cfg, faultslip.cfg]
keywords = [quadrilateral cells]
arguments = [faultslip.cfg, faultslip_quad.cfg]

[pylithapp.problem]
defaults.name = faultslip_quad

[pylithapp.mesh_generator.reader]
filename = mesh_quad.msh

