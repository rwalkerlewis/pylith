[pylithapp.metadata]
description = Poroelasticity simulation with prescribed nonzero fault slip.
authors = [PyLith Test Framework]
keywords = [poroelasticity, fault, prescribed slip, earthquake simulation]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

features = [
    Quasistatic simulation,
    pylith.faults.FaultCohesiveKin,
    pylith.faults.KinSrcStep,
    pylith.materials.Poroelasticity,
    pylith.materials.IsotropicLinearPoroelasticity,
    pylith.bc.DirichletTimeDependent,
    spatialdata.spatialdb.UniformDB
    ]


# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
initial_dt = 1.0*year
start_time = -1.0*year
end_time = 5.0*year


# ----------------------------------------------------------------------
# faults
# ----------------------------------------------------------------------
# Prescribe 0.5 m of left-lateral strike-slip at t=0
# This is a modest slip amount that should be numerically tractable
[pylithapp.problem.interfaces.fault.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Fault rupture auxiliary field spatial database
db_auxiliary_field.values = [initiation_time, final_slip_left_lateral, final_slip_opening]
db_auxiliary_field.data = [0.0*s, 0.5*m, 0.0*m]


# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
# Simple boundary conditions:
# - Fix all displacement on x boundaries (far field)
# - Fix y-displacement on y boundaries
# - Zero pressure on y boundaries (drained)

[pylithapp.problem]
bc = [bc_disp_xneg, bc_disp_xpos, bc_disp_yneg, bc_disp_ypos, bc_press_yneg, bc_press_ypos]
bc.bc_disp_xneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_xpos = pylith.bc.DirichletTimeDependent
bc.bc_disp_yneg = pylith.bc.DirichletTimeDependent
bc.bc_disp_ypos = pylith.bc.DirichletTimeDependent
bc.bc_press_yneg = pylith.bc.DirichletTimeDependent
bc.bc_press_ypos = pylith.bc.DirichletTimeDependent

# Fix x and y displacement on left boundary
[pylithapp.problem.bc.bc_disp_xneg]
constrained_dof = [0, 1]
label = boundary_xneg
label_value = 10
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC -x edge

# Fix x and y displacement on right boundary
[pylithapp.problem.bc.bc_disp_xpos]
constrained_dof = [0, 1]
label = boundary_xpos
label_value = 11
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC +x edge

# Fix y displacement on bottom boundary
[pylithapp.problem.bc.bc_disp_yneg]
constrained_dof = [1]
label = boundary_yneg
label_value = 12
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC -y edge

# Fix y displacement on top boundary  
[pylithapp.problem.bc.bc_disp_ypos]
constrained_dof = [1]
label = boundary_ypos
label_value = 13
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC +y edge

# Zero pressure on bottom boundary (drained boundary)
[pylithapp.problem.bc.bc_press_yneg]
field = pressure
constrained_dof = [0]
label = boundary_yneg
label_value = 12
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet pressure BC -y edge

# Zero pressure on top boundary (drained boundary)
[pylithapp.problem.bc.bc_press_ypos]
field = pressure
constrained_dof = [0]
label = boundary_ypos
label_value = 13
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet pressure BC +y edge


# End of file
