[pylithapp.metadata]
description = Black oil poroelasticity test with body forces and zero displacement/pressure BCs.
authors = [PyLith Development Team]
keywords = [poroelasticity, black oil, gravity]
version = 1.0.0
pylith_version = [>=4.0, <6.0]

features = [
    Static simulation,
    pylith.materials.IsotropicLinearBlackOilPoroelasticity,
    pylith.bc.DirichletTimeDependent,
    pylith.bc.ZeroDB
    ]


# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
initial_dt = 1.0*year
start_time = -1.0*year
end_time = 15.0*year


# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
[pylithapp.problem.materials.poroelastic]
use_body_force = True

db_auxiliary_field.values = [solid_density, fluid_density, fluid_viscosity, porosity, shear_modulus, drained_bulk_modulus, biot_coefficient, fluid_bulk_modulus, isotropic_permeability, reference_pressure, fluid_compressibility, fluid_compressibility_coefficient, viscosity_coefficient, body_force_x, body_force_y]
db_auxiliary_field.data = [2500*kg/m**3, 1000*kg/m**3, 1.0e-3*Pa*s, 0.02, 30.0*GPa, 80.0*GPa, 0.7, 10.0*GPa, 1.0e-14*m**2, 10.0*MPa, 1.0e-10*1/Pa, 0.0*1/Pa, 0.0*1/Pa, 10.0*kPa/m, 0.0*Pa/m]

auxiliary_subfields.body_force.basis_order = 0


# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem]
bc = [bc_xpos, bc_yneg, bc_ypos, bc_xneg]
bc.bc_xpos = pylith.bc.DirichletTimeDependent
bc.bc_yneg = pylith.bc.DirichletTimeDependent
bc.bc_ypos = pylith.bc.DirichletTimeDependent
bc.bc_xneg = pylith.bc.DirichletTimeDependent

[pylithapp.problem.bc.bc_xpos]
constrained_dof = [0]
label = boundary_xpos
label_value = 11
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC +x edge

[pylithapp.problem.bc.bc_yneg]
constrained_dof = [1]
label = boundary_yneg
label_value = 12
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC -y edge

[pylithapp.problem.bc.bc_ypos]
constrained_dof = [1]
label = boundary_ypos
label_value = 13
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC +y edge

[pylithapp.problem.bc.bc_xneg]
field = pressure
constrained_dof = [0]
label = boundary_xneg
label_value = 10
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet pressure BC -x edge

# End of file
